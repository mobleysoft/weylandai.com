name = "weyland-subx-worker"
main = "src/index.js"
compatibility_date = "2025-10-31"
compatibility_flags = ["nodejs_compat"]

# Explicitly kept on (same as every other weyland-*-worker): adding
# [[routes]] below makes Wrangler disable the workers.dev subdomain by
# default on deploy. It was on before this worker's routes moved into this
# file (checked 2026-10-07: enabled, previews enabled).
workers_dev = true

# SubX + TakeoffX extracted out of weylandai.com's monolith
# (src/legacy-monolith.js / weyland.worker.js) as their own standalone
# Worker, per the 2026-09-12 microservices push (MICROSERVICES_PUSH.md)
# and the same Service-Binding pattern already proven live by
# weyland-ocr-worker and weyland-market-intelligence-worker. No build
# step - plain ESM, `wrangler deploy` directly from source.
#
# D1/R2/KV bindings below point at the SAME live production resources
# weylandai-com-worker uses (same binding names, same IDs, taken directly
# from that worker's own wrangler.toml) - this worker reads/writes the
# real submittals/hardware_extraction_sessions/hardware_sets/etc. tables
# (including the real 59,998-row product_variants table this pipeline
# depends on), not a copy. No new database, no migration.

[[d1_databases]]
binding = "DB"
database_name = "weyland_db"
database_id = "5729f77e-d7e3-4577-ab43-3c064fa90ca5"

[[kv_namespaces]]
binding = "CACHE"
id = "80a77dcf4f5f4e8588c172f2ecef95fb"

# Same-account, zero-network-hop Service Binding to the already-deployed
# weyland-ocr-worker (PDFium + tesseract, no external API) - used by
# hardware-schedule-extract.js's detect-schedules route and
# hardware-extraction-vision-dispatch.js's embedded_gofaineat path.
[[services]]
binding = "OCR_SERVICE"
service = "weyland-ocr-worker"

# Needed by hardware-extraction-region-render.js's renderRegionAt600DPI2
# (region-zoom rendering for hardware-schedule-page-affirm.js's
# extract-region and hardware-schedule-generate.js).
[browser]
binding = "BROWSER"

# Same real R2 buckets weylandai-com-worker uses for SubX uploads/outputs
# (bucket names literally say so) - not new buckets, not a copy.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "subx-uploads"

[[r2_buckets]]
binding = "OUTPUTS"
bucket_name = "subx-outputs"

# *.html pages (src/pages/subx-app.html, subx.html, takeoffx.html) are
# imported as raw text in src/index.js - a real Wrangler built-in module
# rule, not a custom bundler step (per 2026-09-12 "no bundler for new
# work" instruction).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Client-side OCR/grid-extraction assets (pdf.js for rendering, tesseract-wasm
# for OCR - both real, vendored, not new deps) served to the browser so
# hardware_schedule/door_schedule extraction runs entirely in the customer's
# own tab: zero Cloudflare CPU spent on rendering/OCR, no per-page CPU
# ceiling, works in a field/disconnected environment once the page is
# loaded. All renamed to .bin - Wrangler's built-in module handling silently
# claims .wasm/.mjs/.pdf-shaped extensions even with an explicit custom rule
# targeting them (confirmed live 2026-10-01: produced a 0-byte response with
# no error) - .bin has no built-in meaning and is the proven-reliable fix.
[[rules]]
type = "Data"
globs = ["assets/client-ocr/*.bin"]
fallthrough = true

# Zone routes (2026-10-07). Until now this worker's routes existed only in
# the Cloudflare dashboard/API, as EXACT patterns for the pages
# (weylandai.com/subx-app, /subx, /takeoffx). An exact pattern does not match
# the same path with a query string, so the single-page shell's
# /subx-app?embed=1 (and /takeoffx?embed=1, /subx?embed=1) fell through to
# weylandai.com/* on weylandai-com-worker, which served an older copy of the
# workspace (no client-side extraction, 'bridge' / 'managed API' route
# buttons) - the overlay and the direct page were two different apps.
# The page patterns are wildcards now; src/index.js serves the path variants
# they bring (query strings, trailing slash).
#
# "wrangler deploy" PUTs this list as the COMPLETE set of routes for this
# script (routes not listed here are deleted), so every route this worker
# owned before is listed: the API patterns are unchanged from the zone
# listing taken 2026-10-07 05:0xZ.
[[routes]]
pattern = "weylandai.com/subx*"
zone_name = "weylandai.com"

# Already covered by /subx*; listed on its own so the workspace's route is
# visible in the zone listing by name.
[[routes]]
pattern = "weylandai.com/subx-app*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/takeoffx*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/hardware-schedule"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/hardware-schedule/*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/submittals"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/submittals/*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/takeoff"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/takeoff/*"
zone_name = "weylandai.com"

# The homepage's per-visitor copy of SubX's demo project, "The WeylandAI
# Building" (POST /api/demo/weyland-building/session, routes/demo-building.js).
# Served by the monolith's src/routes/demo-trial.js until 2026-10-07; here so
# the copy carries the demo's hardware sets with their parts and is written in
# one D1 batch. Ends in * so a trailing slash or a query string arrives here
# too.
[[routes]]
pattern = "weylandai.com/api/demo/weyland-building/session*"
zone_name = "weylandai.com"
