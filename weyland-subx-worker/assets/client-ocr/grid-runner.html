<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>SubX grid runner</title>
</head>
<body>
<script type="module">
// Server-side runner for weyland-subx-worker (lib/browser-grid-extraction.js):
// a Cloudflare Browser Rendering tab opens this page and calls
// window.__runGrid(...) with the session's PDF. It runs the SAME grid
// extraction module the SubX workspace runs in a visitor's tab (pdf.js +
// tesseract-wasm), so the server and the browser can never drift apart.
// Nothing here is shown to visitors.
import * as grid from "/api/hardware-schedule/client-ocr-assets/schedule-grid-extraction-client.mjs?v=20261009g004";

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// The PDF is fetched by this tab once per session (2026-10-08: pushing 9 MB
// of base64 through one CDP call per page cost the Worker its memory on long
// bid sets) and kept here for every page read that follows.
let pdfBytes = null;
window.__loadPdf = async (url) => {
  const t0 = performance.now();
  const r = await fetch(url, { credentials: "omit", cache: "no-store" });
  if (!r.ok) return { ok: false, error: "GET of the PDF answered " + r.status };
  pdfBytes = new Uint8Array(await r.arrayBuffer());
  return { ok: true, bytes: pdfBytes.length, ms: Math.round(performance.now() - t0) };
};
function inputBytes(input) {
  if (input && input.cached && pdfBytes) return pdfBytes;
  if (input && input.b64) return b64ToBytes(input.b64);
  throw new Error("no PDF bytes were passed to the runner");
}

// input: { b64 } or { cached: true }; scheduleType: "door_schedule" | "hardware_schedule".
window.__runGrid = async (input, pageNumber, scheduleType, options) => {
  const logs = [];
  const t0 = performance.now();
  const note = (m) => logs.push(Math.round(performance.now() - t0) + "ms " + m);
  try {
    const bytes = inputBytes(input);
    const fn = scheduleType === "door_schedule" ? grid.extractDoorScheduleFromPdf : grid.extractHardwareScheduleFromPdf;
    const result = await fn(bytes.buffer, pageNumber, note, options || {});
    return { ok: true, result, logs, ms: Math.round(performance.now() - t0) };
  } catch (e) {
    return { ok: false, error: String((e && e.message) || e), logs, ms: Math.round(performance.now() - t0) };
  }
};
// Where the schedules are in a whole bid set, from the text layer of every page.
window.__findPages = async (input, options) => {
  const logs = [];
  const t0 = performance.now();
  const note = (m) => logs.push(Math.round(performance.now() - t0) + "ms " + m);
  try {
    const bytes = inputBytes(input);
    const result = await grid.findSchedulePages(bytes.buffer, note, options || {});
    return { ok: true, result, logs, ms: Math.round(performance.now() - t0) };
  } catch (e) {
    return { ok: false, error: String((e && e.message) || e), logs, ms: Math.round(performance.now() - t0) };
  }
};
window.__gridRunnerReady = true;
</script>
</body>
</html>
