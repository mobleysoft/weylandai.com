  <style>
    :root{--bg:#090a0d;--panel:#121419;--panel2:#181b21;--line:#2c3139;--text:#edf0f1;--muted:#9299a3;--gold:#f0b800;--green:#61dfa0;--blue:#66d4ff;--red:#ff756e}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Helvetica Neue",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 5%,rgba(240,184,0,.12),transparent 27rem),linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}.shell{position:relative;max-width:1500px;margin:auto;padding:18px clamp(14px,2.5vw,34px) 40px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}.mark{width:42px;height:42px;display:grid;place-items:center;background:var(--gold);color:var(--bg);font-weight:900}.brand b{display:block;letter-spacing:.16em}.brand small{display:block;color:var(--muted);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.11em}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,.button{border:1px solid var(--line);border-radius:99px;padding:9px 12px;color:var(--text);text-decoration:none;background:transparent;font:750 10px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer}.nav a:hover,.button:hover{border-color:var(--gold);color:var(--gold)}.button.primary{background:var(--gold);border-color:var(--gold);color:var(--bg)}.titlebar{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:28px 0 18px}.eyebrow{color:var(--gold);font:800 10px/1 ui-monospace,monospace;letter-spacing:.17em}.titlebar h1{font-size:clamp(36px,5vw,72px);letter-spacing:-.055em;line-height:.93;margin:11px 0}.titlebar p{max-width:700px;color:var(--muted);line-height:1.6;margin:0}.pill{white-space:nowrap;border:1px solid rgba(97,223,160,.35);color:var(--green);border-radius:99px;padding:10px 13px;font:800 9px/1 ui-monospace,monospace;letter-spacing:.09em}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.65fr);gap:18px}.card{background:rgba(18,20,25,.94);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.22)}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.card h2{font-size:17px;margin:0}.meta{color:var(--muted);font:700 9px/1 ui-monospace,monospace;letter-spacing:.08em}.proposal-head{padding:22px;border:1px solid var(--line);background:#0d0f12;border-radius:14px;margin-bottom:14px}.proposal-head h2{font-size:30px;margin:5px 0}.proposal-head p{color:var(--muted);margin:4px 0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.fact{border-top:1px solid var(--line);padding-top:10px}.fact span{display:block;color:var(--muted);font:700 9px/1.4 ui-monospace,monospace}.fact strong{display:block;font-size:13px;margin-top:3px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font:750 9px/1 ui-monospace,monospace;letter-spacing:.08em;padding:10px 8px;border-bottom:1px solid var(--line)}td{padding:11px 8px;border-bottom:1px solid #20242a;vertical-align:top}td:last-child,th:last-child{text-align:right}.source{display:block;color:var(--blue);font:700 9px/1.4 ui-monospace,monospace;margin-top:4px}.money{width:95px;background:#0b0d10;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px;text-align:right}.total{margin-left:auto;width:min(100%,340px);padding-top:15px}.total div{display:flex;justify-content:space-between;padding:7px 0;color:var(--muted);font-size:13px}.total .grand{border-top:1px solid var(--gold);color:var(--text);font-size:20px;font-weight:800}.warning{margin-top:14px;border-left:2px solid var(--gold);padding:10px 13px;color:var(--muted);font-size:12px;line-height:1.55;background:rgba(240,184,0,.04)}.stack{display:grid;gap:10px}.step{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:31px 1fr;gap:10px}.step b{display:grid;place-items:center;width:30px;height:30px;background:rgba(240,184,0,.11);color:var(--gold);border-radius:8px;font:800 10px ui-monospace,monospace}.step strong{font-size:13px}.step small{display:block;color:var(--muted);margin-top:3px}.source-list{display:grid;gap:8px}.source-item{border:1px solid var(--line);border-radius:11px;padding:11px}.source-item strong{font-size:12px}.source-item span{display:block;color:var(--blue);font:700 9px/1.5 ui-monospace,monospace}.source-item p{color:var(--muted);font-size:11px;line-height:1.45;margin:5px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.audit{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font:700 9px/1.7 ui-monospace,monospace}.loading{padding:50px;text-align:center;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}.titlebar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.nav a:nth-child(-n+2){display:none}}@media print{body:before,header,.titlebar,.side,.actions,.warning{display:none!important}.shell{padding:0}.layout{display:block}.card{border:0;box-shadow:none;padding:0}.proposal-head{border:0;padding:0}body{background:#fff;color:#111}td,th{border-color:#ddd}.source,.proposal-head p,.fact span{color:#555}.money{border:0;color:#111;background:#fff}.total div{color:#333}}
