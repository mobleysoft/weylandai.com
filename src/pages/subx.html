<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>SubX | Cut-Sheet Matching &amp; Submittal Package Automation</title>
  <style>
    :root{--bg:#090a0d;--panel:#121419;--panel2:#181b21;--line:#2c3139;--text:#edf0f1;--muted:#9299a3;--gold:#f0b800;--green:#61dfa0;--blue:#66d4ff;--red:#ff756e;--purple:#a78bfa}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Helvetica Neue",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 20%,rgba(167,139,242,.12),transparent 28rem),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}
    .shell{position:relative;max-width:1500px;margin:auto;padding:20px clamp(16px,3vw,40px) 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
    .mark{width:42px;height:42px;display:grid;place-items:center;background:var(--purple);color:var(--bg);font-weight:900}
    .brand b{display:block;letter-spacing:.16em}
    .brand small{display:block;color:var(--muted);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.11em}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav a,.button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--text);text-decoration:none;background:transparent;font:750 10px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:all .2s}
    .nav a:hover,.button:hover{border-color:var(--purple);color:var(--purple);box-shadow:0 0 15px rgba(167,139,242,.2)}
    .button.primary{background:var(--purple);border-color:var(--purple);color:var(--bg);font-weight:900}
    .titlebar{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:35px 0 25px}
    .eyebrow{color:var(--purple);font:800 11px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
    .titlebar h1{font-size:clamp(34px,4.5vw,64px);letter-spacing:-.05em;line-height:1.02;margin:12px 0}
    .titlebar p{max-width:680px;color:var(--muted);line-height:1.6;margin:0;font-size:16px}
    .pill{border:1px solid rgba(167,139,242,.4);color:var(--purple);border-radius:99px;padding:10px 15px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.1em;background:rgba(167,139,242,.1)}
    .table-card{background:rgba(18,20,25,.94);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.25);margin-bottom:24px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;color:var(--muted);font:750 10px/1 ui-monospace,monospace;letter-spacing:.1em;padding:16px 20px;background:#0d0f14;border-bottom:2px solid var(--line)}
    td{padding:16px 20px;border-bottom:1px solid #1f232b;vertical-align:middle}
    tr:hover td{background:rgba(167,139,242,.04)}
    .status-badge{font:800 9px ui-monospace,monospace;padding:5px 10px;border-radius:99px;display:inline-block;letter-spacing:.08em}
    .status-matched{background:rgba(97,223,160,.15);color:var(--green);border:1px solid rgba(97,223,160,.35)}
    .status-pending{background:rgba(240,184,0,.15);color:var(--gold);border:1px solid rgba(240,184,0,.35)}
    .note-card{background:rgba(18,20,25,.9);border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--muted);font-size:14px;line-height:1.6}
    .note-card code{background:#161920;padding:2px 6px;border-radius:4px;color:var(--purple);font-size:13px}
    @media(max-width:900px){.titlebar{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/"><span class="mark">SX</span><span><b>SUBX</b><small>CUT-SHEET MATCHING & SUBMITTALS</small></span></a>
      <nav class="nav">{{NAV}}) +
