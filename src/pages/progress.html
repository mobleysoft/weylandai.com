<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>WeylandAI Progress & Weekend Engineering Timeline | Sovereign Architecture</title>
  <style>
    :root{
      --bg:#090a0d;--panel:#121419;--panel2:#181c24;--line:#2c3139;
      --text:#edf0f1;--muted:#9299a3;--gold:#f0b800;--green:#61dfa0;
      --blue:#66d4ff;--purple:#a78bfa;--red:#ff756e;--cyan:#00f2ff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Helvetica Neue",sans-serif;overflow-x:hidden;}
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(circle at 50% 15%, rgba(0,242,255,0.12), transparent 35rem),
                 radial-gradient(circle at 85% 85%, rgba(167,139,242,0.1), transparent 30rem),
                 linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
                 linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
      background-size:auto,auto,32px 32px,32px 32px;
    }
    .shell{position:relative;z-index:1;max-width:1350px;margin:auto;padding:20px clamp(16px,3vw,40px) 80px;}
    
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px;}
    .brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;}
    .mark{width:42px;height:42px;display:grid;place-items:center;background:var(--cyan);color:var(--bg);font-weight:900;border-radius:10px;box-shadow:0 0 15px rgba(0,242,255,0.4);}
    .brand b{display:block;letter-spacing:.16em;font-weight:900;}
    .brand small{display:block;color:var(--muted);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.11em;}
    
    .nav{display:flex;gap:8px;flex-wrap:wrap;}
    .nav a,.button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--text);text-decoration:none;background:rgba(18,20,25,0.7);backdrop-filter:blur(10px);font:750 10px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:all .2s;}
    .nav a:hover,.button:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 15px rgba(0,242,255,.2);transform:translateY(-1px);}
    .button.primary{background:linear-gradient(135deg,var(--cyan),#0088ff);border-color:var(--cyan);color:#000;font-weight:900;box-shadow:0 0 25px rgba(0,242,255,.35);}
    .button.primary:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(0,242,255,.6);}
    
    .titlebar{text-align:center;margin:45px 0 60px;}
    .eyebrow{color:var(--cyan);font:800 11px/1 ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;display:inline-block;padding:6px 14px;background:rgba(0,242,255,0.08);border:1px solid rgba(0,242,255,0.3);border-radius:99px;margin-bottom:16px;box-shadow:0 0 12px rgba(0,242,255,0.15);}
    .titlebar h1{font-size:clamp(36px,5vw,66px);letter-spacing:-.05em;line-height:1.05;margin:0 0 18px;background:linear-gradient(135deg,#ffffff 0%,#a5b4fc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    .titlebar p{max-width:760px;color:var(--muted);line-height:1.6;margin:0 auto;font-size:18px;}

    /* Timeline Styling */
    .timeline{position:relative;max-width:1050px;margin:0 auto;padding-left:40px;}
    .timeline::before{content:"";position:absolute;top:10px;left:15px;bottom:10px;width:3px;background:linear-gradient(to bottom, var(--cyan), var(--purple), var(--green), var(--gold));border-radius:99px;box-shadow:0 0 12px rgba(0,242,255,0.4);}

    .node{position:relative;margin-bottom:55px;padding-left:25px;}
    .node::before{
      content:"";position:absolute;left:-34px;top:4px;width:20px;height:20px;
      border-radius:50%;background:#090a0d;border:4px solid var(--cyan);
      box-shadow:0 0 20px var(--cyan);transition:transform 0.3s;
    }
    .node:hover::before{transform:scale(1.25);background:var(--cyan);}
    .node.purple::before{border-color:var(--purple);box-shadow:0 0 20px var(--purple);}
    .node.purple:hover::before{background:var(--purple);}
    .node.green::before{border-color:var(--green);box-shadow:0 0 20px var(--green);}
    .node.green:hover::before{background:var(--green);}
    .node.gold::before{border-color:var(--gold);box-shadow:0 0 20px var(--gold);}
    .node.gold:hover::before{background:var(--gold);}
    
    .card{background:rgba(18,20,25,.85);border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 25px 70px rgba(0,0,0,.4);backdrop-filter:blur(16px);transition:all 0.25s;}
    .card:hover{transform:translateY(-3px);border-color:rgba(0,242,255,0.35);box-shadow:0 30px 85px rgba(0,242,255,.15);}
    
    .meta-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;border-bottom:1px solid #1e232d;padding-bottom:14px;}
    .timestamp{font:800 11px/1 ui-monospace,monospace;color:var(--cyan);letter-spacing:0.1em;text-transform:uppercase;}
    .badge-vector{font:750 10px/1 ui-monospace,monospace;padding:5px 12px;border-radius:99px;border:1px solid rgba(255,255,255,0.15);color:#fff;background:rgba(255,255,255,0.05);}
    
    .card h2{font-size:26px;font-weight:800;color:#fff;margin:0 0 12px;letter-spacing:-0.03em;}
    .card p{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 22px;}
    
    .deliverables-box{background:#0e1016;border:1px solid #1e232f;border-radius:12px;padding:20px;margin-bottom:18px;}
    .deliverables-title{font:800 11px/1 ui-monospace,monospace;color:var(--muted);letter-spacing:0.12em;display:block;margin-bottom:14px;}
    
    .del-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
    .del-item{display:flex;align-items:center;gap:10px;font-size:14px;color:#fff;font-weight:600;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;text-decoration:none;transition:all 0.2s;}
    .del-item:hover{background:rgba(0,242,255,0.08);border-color:rgba(0,242,255,0.4);color:var(--cyan);}
    .del-icon{color:var(--green);font-weight:900;font-size:16px;}
    
    .tech-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
    .tag{background:rgba(255,255,255,0.05);color:#a5b4fc;border:1px solid rgba(165,180,252,0.2);padding:4px 10px;border-radius:6px;font:700 11px/1 ui-monospace,monospace;}
    
    .telemetry-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px 0 50px;}
    .stat-card{background:rgba(18,20,25,.88);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left;}
    .stat-card span{color:var(--muted);font:750 10px/1 ui-monospace,monospace;letter-spacing:.1em;display:block;text-transform:uppercase;}
    .stat-card strong{font-size:30px;font-weight:900;color:var(--text);margin-top:8px;display:block;}
    
    @media(max-width:900px){
      .telemetry-bar{grid-template-columns:repeat(2,1fr);}
      .timeline{padding-left:25px;}
      .node::before{left:-25px;width:16px;height:16px;}
    }
  </style>
</head>
