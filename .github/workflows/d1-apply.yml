# Apply one reviewed SQL file in tools/catalogue-seeds/ to weyland_db (2026-10-09).
#
# For catalogue data that has no route of its own (a manufacturer, its aliases): the SQL is
# committed and reviewed first, then applied here by hand. It runs with CLOUDFLARE_READ_TOKEN,
# the cloud session's own token (D1 Write; R2, KV, Scripts and Tail Read), never the deploy
# token. Only files under tools/catalogue-seeds/ are accepted; the seeds use INSERT OR IGNORE,
# so a second run changes nothing.
name: Apply catalogue seed

on:
  workflow_dispatch:
    inputs:
      file:
        description: "tools/catalogue-seeds/<name>.sql"
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the file
        id: f
        env:
          FILE: ${{ inputs.file }}
        run: |
          if ! printf '%s' "$FILE" | grep -Eq '^tools/catalogue-seeds/[A-Za-z0-9._-]+\.sql$'; then echo "only tools/catalogue-seeds/*.sql"; exit 1; fi
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          grep -c ';' "$FILE"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 d1 execute weyland_db --remote --file "${{ steps.f.outputs.file }}"
