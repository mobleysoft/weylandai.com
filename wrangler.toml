name = "weylandai-com-worker"
main = "weyland.worker.js"
compatibility_date = "2025-10-31"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ──────────────────────────────────────────────
# Created 2026-08-30, schema applied from schema.sql (86 tables,
# reconstructed from the real weyland_onamerica_schema.sql source of
# truth found in MHSCOM/ingested_assets/d1/). Previously the live worker
# had NO database bound at all despite the code depending on it.
[[d1_databases]]
binding = "DB"
database_name = "weyland_db"
database_id = "5729f77e-d7e3-4577-ab43-3c064fa90ca5"

# ── KV Namespaces ────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id = "80a77dcf4f5f4e8588c172f2ecef95fb"

[[kv_namespaces]]
binding = "DEMO_REQUESTS"
id = "090d0771923a4c40b6c37dadf6e8f067"

# ── Service Bindings ─────────────────────────────────────────
# weyland-ocr-worker: dedicated OCR/PDF-vision service (PDFium + tesseract,
# both bundled directly - no runtime WASM compilation, no KV, no external
# API). Same-account service binding, zero network hop, real and verified
# end-to-end 2026-08-30.
[[services]]
binding = "OCR_SERVICE"
service = "weyland-ocr-worker"

# vendyai-com-worker: the conglomerate's single point of direct Stripe
# integration (per John's 2026-09-03 directive: all ventures sell through
# vendyai, authenticate through AuthFor). Same-account service binding,
# zero network hop - replaces the broken env.VENDYAI_API_URL fetch() path
# that /api/subscription/checkout used (the var was never actually set,
# so that endpoint threw on every real call before this).
[[services]]
binding = "VENDYAI"
service = "vendyai-com-worker"

# mascom-edge: shared conglomerate-wide pull-through cache for GitHub-Pages-
# sourced static content (local disk -> GitHub repo -> GitHub Pages ->
# mascom-edge cache -> visitor). Used here only for the homepage "/" - the
# other marketing pages still live as bundled HTML in this worker until
# they're published to the weylandai.com GitHub Pages repo too. Falls back
# to the bundled copy automatically if this binding errors or 404s.
[[services]]
binding = "MASCOM_EDGE"
service = "mascom-edge"

# ── Browser Rendering ────────────────────────────────────────
# Needed for quote/proposal PDF generation (puppeteer_cloudflare_default.
# launch(env2.BROWSER)) - was never bound, so every PDF-producing endpoint
# (TakeoffX generate-quote, and now PropX generate-proposal) would fail.
[browser]
binding = "BROWSER"

# ── R2 Buckets ───────────────────────────────────────────────
# R2 is enabled on this account (the 2026-08-30 comment claiming otherwise
# was stale - both buckets already existed, just never bound here).
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "subx-uploads"

[[r2_buckets]]
binding = "OUTPUTS"
bucket_name = "subx-outputs"

# ── Durable Objects ──────────────────────────────────────────
# SIGHTX_ROOM: real-time presence/chat/WebRTC-signaling relay for MeetingX
# (live avatars + text/voice chat layered into the SightX walkthrough - not
# a separate app, per the actual product architecture). One DO instance per
# project, keyed by idFromName(projectId).
[[durable_objects.bindings]]
name = "SIGHTX_ROOM"
class_name = "SightXRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SightXRoom"]
