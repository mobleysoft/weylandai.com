name = "weyland-market-intelligence-worker"
main = "src/index.js"
compatibility_date = "2025-10-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# First real microservices-push extraction out of the weylandai.com
# monolith (weyland.worker.js / src/legacy-monolith.js), per
# WEYLAND_SUCCESSOR_ARCHITECTURE.md's strangler-fig migration plan and
# the same Service Binding pattern already proven live by
# weyland-ocr-worker. Owns the 6 "X-tool" market-intelligence routes
# (PriceX materials, MarketX trends, CompX vendor search, WeatherX
# delay-risk, ForecastX cash-flow, GeoX geocoding). CompX/WeatherX/
# ForecastX/GeoX remain genuinely stateless (no D1, live public keyless
# calls or pure math). PriceX/MarketX's original design note here ("chosen
# because this cluster is genuinely stateless... pricing.js was ruled out
# because hardware_sets/hardware_components are globally empty in
# production") is now stale on two counts - see the 2026-09-12 history
# below: PriceX is no longer stateless (it now reads weyland_db directly),
# and hardware_sets/hardware_components/product_variants are NOT empty
# anymore (real catalog ingestion since populated 59,998 product_variants
# rows with real prices) - re-verify claims like this against a live query
# before trusting an old comment, this file included.
#
# No KV, no R2, no Durable Objects, no auth binding needed.
#
# 2026-09-12 history (same day, two corrections in sequence):
# (1) FRED_API_KEY removed - root cause of PriceX/MarketX 502s was a
#     dead/unregistered secret calling the keyed api.stlouisfed.org JSON
#     API live, per-request. First fix attempt cached FRED's free,
#     keyless fredgraph.csv export in D1 on a weekly refresh instead.
# (2) That first fix was itself reverted the same day on John's direct,
#     broader correction: "Depending on competitor API's in any way at
#     all is a non starter for us" - meaning ANY external party's
#     service, even a free, keyless, government one like FRED. PriceX now
#     reads ONLY this account's own first-party door-hardware catalog
#     data (weyland_db's products/product_variants tables - real
#     manufacturer catalog data weylandai.com's own extraction pipeline
#     already ingested, not fetched from anywhere at request time).
#     MarketX has no first-party equivalent for macro construction/
#     housing trend data (takeoff_quotes/quotes are still 0 rows in
#     production - no real customer transaction history exists yet to
#     build a real market-trend signal from) and is honestly retired
#     (501, not faked, not silently 404'd) until that changes.
[[d1_databases]]
binding = "DB"
database_name = "weyland-market-intelligence-db"
database_id = "987411cc-07a5-43ae-848c-e18e4f2cec35"

# Read-only (SELECT-only in this worker's own code) second D1 binding to
# the main weylandai.com monolith's real production database, so PriceX
# can compute its pricing index from the account's own real catalog data
# instead of any external source. Same database, same binding name (DB)
# convention as weylandai-com-worker's own wrangler.toml - see that
# file's [[d1_databases]] block for the primary/write-capable binding.
[[d1_databases]]
binding = "WEYLAND_DB"
database_name = "weyland_db"
database_id = "5729f77e-d7e3-4577-ab43-3c064fa90ca5"

# 2026-10-08: CompX, WeatherX, ForecastX and GeoX are rebuilt here and
# answered by this worker directly (until today the monolith served their
# pages and reached these APIs through a service binding).
[[routes]]
pattern = "weylandai.com/api/compx/*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/compx*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/geox/*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/geox*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/weatherx/*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/weatherx*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/api/forecastx/*"
zone_name = "weylandai.com"

[[routes]]
pattern = "weylandai.com/forecastx*"
zone_name = "weylandai.com"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
