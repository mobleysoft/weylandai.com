name = "weyland-ocr-worker"
main = "index.js"
compatibility_date = "2025-10-31"
compatibility_flags = ["nodejs_compat"]

# .wasm files use Cloudflare's default handling: compiled to a
# WebAssembly.Module at DEPLOY time, not at request time. Workers disallow
# WASM code generation from raw bytes at runtime (V8's
# AllowWasmCodeGenerationCallback is off here) - confirmed by testing, not
# assumed. The trained-data file isn't WASM, just a binary blob the OCR
# engine reads as raw bytes, so it stays a Data import.
[[rules]]
type = "Data"
globs = ["assets/*.bin"]
fallthrough = true

# Real, measured requirement, not a defensive guess: OCR-ing a dense real
# door-schedule table (tessedit_pageseg_mode 6 over a ~3300x1070 cropped,
# 2x-upscaled region) took ~10-12 CPU-seconds locally on this Mac when
# testing against /Users/johnmobley/pdf/OCCDoorSchedulePg4.pdf. The
# platform default CPU limit was not enough - confirmed live via a real
# HTTP 503 (Cloudflare error 1102, "Worker exceeded resource limits")
# before this was raised.
[limits]
cpu_ms = 30000
