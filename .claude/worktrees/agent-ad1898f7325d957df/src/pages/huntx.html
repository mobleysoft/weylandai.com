<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>HuntX | Municipal RFP & Permit Reconnaissance Spider</title>
  <style>
    :root{--bg:#090a0d;--panel:#121419;--panel2:#181b21;--line:#2c3139;--text:#edf0f1;--muted:#9299a3;--gold:#f0b800;--green:#61dfa0;--blue:#66d4ff;--red:#ff756e;--purple:#a78bfa}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Helvetica Neue",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 85% 15%,rgba(102,212,255,.12),transparent 28rem),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}
    .shell{position:relative;max-width:1500px;margin:auto;padding:20px clamp(16px,3vw,40px) 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
    .mark{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:var(--bg);font-weight:900}
    .brand b{display:block;letter-spacing:.16em}
    .brand small{display:block;color:var(--muted);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.11em}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav a,.button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--text);text-decoration:none;background:transparent;font:750 10px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:all .2s}
    .nav a:hover,.button:hover{border-color:var(--blue);color:var(--blue);box-shadow:0 0 15px rgba(102,212,255,.2)}
    .button.primary{background:var(--blue);border-color:var(--blue);color:var(--bg);font-weight:900}
    .titlebar{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:35px 0 25px}
    .eyebrow{color:var(--blue);font:800 11px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
    .titlebar h1{font-size:clamp(34px,4.5vw,64px);letter-spacing:-.05em;line-height:1.02;margin:12px 0}
    .titlebar p{max-width:680px;color:var(--muted);line-height:1.6;margin:0;font-size:16px}
    .pill{border:1px solid rgba(102,212,255,.4);color:var(--blue);border-radius:99px;padding:10px 15px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.1em;background:rgba(102,212,255,.1)}
    
    .filter-bar{display:flex;gap:15px;margin-bottom:24px;flex-wrap:wrap;background:#0e1117;padding:18px 24px;border:1px solid var(--line);border-radius:16px;align-items:center}
    .search-input{flex:1;min-width:280px;background:#161920;border:1px solid var(--line);border-radius:10px;padding:12px 18px;color:#fff;font-size:15px}
    .search-input:focus{outline:none;border-color:var(--blue)}
    select{background:#161920;border:1px solid var(--line);border-radius:10px;padding:12px 18px;color:#fff;font-size:14px;cursor:pointer}
    
    .metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
    .metric-card{background:rgba(18,20,25,.9);border:1px solid var(--line);border-radius:14px;padding:20px}
    .metric-card span{color:var(--muted);font:700 10px/1 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;display:block}
    .metric-card strong{font-size:32px;font-weight:900;color:var(--text);margin-top:8px;display:block}
    
    .table-card{background:rgba(18,20,25,.94);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 25px 70px rgba(0,0,0,.25)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;color:var(--muted);font:750 10px/1 ui-monospace,monospace;letter-spacing:.1em;padding:16px 20px;background:#0d0f14;border-bottom:2px solid var(--line)}
    td{padding:16px 20px;border-bottom:1px solid #1f232b;vertical-align:middle}
    tr:hover td{background:rgba(102,212,255,.04)}
    .status-badge{font:800 9px ui-monospace,monospace;padding:5px 10px;border-radius:99px;display:inline-block;letter-spacing:.08em}
    .status-open{background:rgba(97,223,160,.15);color:var(--green);border:1px solid rgba(97,223,160,.35)}
    .status-urgent{background:rgba(255,117,110,.15);color:var(--red);border:1px solid rgba(255,117,110,.35)}
    .val-cell{font-weight:800;color:var(--blue);font-size:15px}
    
    @media(max-width:900px){.metrics-row{grid-template-columns:repeat(2,1fr)}.titlebar{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/"><span class="mark">HX</span><span><b>HUNTX</b><small>MUNICIPAL RFP SPIDER</small></span></a>
      <nav class="nav">{{NAV}}) +
