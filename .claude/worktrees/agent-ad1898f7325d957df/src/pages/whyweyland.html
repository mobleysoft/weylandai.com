<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>Why WeylandAI? | Sovereign Architecture & Competitive Superiority</title>
  <style>
    :root{--bg:#090a0d;--panel:#121419;--line:#2c3139;--text:#edf0f1;--muted:#9299a3;--gold:#f0b800;--green:#61dfa0;--blue:#66d4ff;--red:#ff756e}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Helvetica Neue",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(0,242,255,.1),transparent 30rem),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}
    .shell{position:relative;max-width:1400px;margin:auto;padding:20px clamp(16px,3vw,40px) 70px}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
    .mark{width:42px;height:42px;display:grid;place-items:center;background:var(--blue);color:var(--bg);font-weight:900}
    .brand b{display:block;letter-spacing:.16em}
    .brand small{display:block;color:var(--muted);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.11em}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav a,.button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--text);text-decoration:none;background:transparent;font:750 10px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:all .2s}
    .nav a:hover,.button:hover{border-color:var(--blue);color:var(--blue)}
    .button.primary{background:var(--blue);border-color:var(--blue);color:var(--bg);font-weight:900}
    
    .titlebar{text-align:center;margin:45px 0 55px}
    .eyebrow{color:var(--blue);font:800 11px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
    .titlebar h1{font-size:clamp(36px,5vw,64px);letter-spacing:-.05em;line-height:1.05;margin:14px 0}
    .titlebar p{max-width:760px;color:var(--muted);line-height:1.6;margin:0 auto;font-size:18px}

    .matrix-card{background:rgba(18,20,25,.94);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);margin-bottom:50px}
    table{width:100%;border-collapse:collapse;font-size:15px}
    th{text-align:left;padding:20px 24px;background:#0e1117;border-bottom:2px solid var(--line);color:var(--muted);font:800 11px/1 ui-monospace,monospace;letter-spacing:.12em}
    td{padding:22px 24px;border-bottom:1px solid #1e222b;vertical-align:top;line-height:1.5}
    tr:hover td{background:rgba(255,255,255,.02)}
    .weyland-col{background:rgba(0,242,255,.05);border-left:1px solid rgba(0,242,255,.2);border-right:1px solid rgba(0,242,255,.2);font-weight:600}
    
    .check-yes{color:var(--green);font-weight:900;font-size:18px;margin-right:8px}
    .check-no{color:var(--red);font-weight:900;font-size:18px;margin-right:8px}
    .pill-win{background:rgba(97,223,160,.15);color:var(--green);border:1px solid rgba(97,223,160,.35);padding:4px 10px;border-radius:99px;font:800 9px ui-monospace,monospace;display:inline-block;margin-top:6px}

    .cta-banner{background:linear-gradient(135deg,#12161f,#0a0d14);border:2px solid var(--gold);border-radius:20px;padding:40px;text-align:center;box-shadow:0 0 50px rgba(240,184,0,.2)}
    .cta-banner h2{font-size:36px;margin:0 0 12px;color:#fff}
    .cta-banner p{color:var(--muted);max-width:620px;margin:0 auto 26px;font-size:16px}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/"><span class="mark">WW</span><span><b>WEYLANDAI</b><small>COMPETITIVE SUPERIORITY</small></span></a>
