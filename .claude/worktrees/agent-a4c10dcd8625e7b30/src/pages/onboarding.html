<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>Onboarding & Licensing | WeylandAI SubConP</title>
  <style>
    :root{--bg:#090a0d;--panel:#121419;--panel2:#181b21;--line:#2c3139;--text:#edf0f1;--muted:#9299a3;--gold:#f0b800;--green:#61dfa0;--blue:#66d4ff;--red:#ff756e;--purple:#a78bfa}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Helvetica Neue",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(240,184,0,.14),transparent 28rem),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}
    .shell{position:relative;max-width:1400px;margin:auto;padding:20px clamp(16px,3vw,40px) 60px}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
    .mark{width:42px;height:42px;display:grid;place-items:center;background:var(--gold);color:var(--bg);font-weight:900}
    .brand b{display:block;letter-spacing:.16em}
    .brand small{display:block;color:var(--muted);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.11em}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav a,.button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--text);text-decoration:none;background:transparent;font:750 10px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:all .2s}
    .nav a:hover,.button:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 15px rgba(240,184,0,.2)}
    .button.primary{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:900}
    .button.primary:hover{transform:scale(1.03);box-shadow:0 0 25px rgba(240,184,0,.5)}
    .titlebar{text-align:center;margin:40px 0 45px}
    .eyebrow{color:var(--gold);font:800 11px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
    .titlebar h1{font-size:clamp(36px,5vw,68px);letter-spacing:-.05em;line-height:1.05;margin:14px 0 16px}
    .titlebar p{max-width:740px;color:var(--muted);line-height:1.6;margin:0 auto;font-size:17px}
    
    .bundle-box{max-width:760px;margin:0 auto 70px;background:linear-gradient(145deg,rgba(24,27,33,.95),rgba(18,20,25,.95));border:2px solid var(--gold);border-radius:22px;padding:36px;box-shadow:0 0 50px rgba(240,184,0,.25);position:relative}
    .badge-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
    .pill{border:1px solid rgba(97,223,160,.4);color:var(--green);border-radius:99px;padding:8px 14px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.08em;background:rgba(97,223,160,.1)}
    .pill-gold{border:1px solid rgba(240,184,0,.5);color:var(--gold);border-radius:99px;padding:8px 14px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.08em;background:rgba(240,184,0,.15)}
    .price-tag{font-size:56px;font-weight:900;color:#fff;margin:16px 0;letter-spacing:-.03em}
    .price-tag span{font-size:18px;color:var(--muted);font-weight:600}
    .slider-box{margin:28px 0;padding:24px;background:#0d0f13;border-radius:14px;border:1px solid var(--line)}
    input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer;height:8px;border-radius:4px;background:#2c3139}
    .feature-list{list-style:none;padding:0;margin:28px 0;display:grid;gap:16px;text-align:left}
    .feature-list li{display:flex;align-items:baseline;gap:12px;font-size:15px;color:#d1d5db;line-height:1.5}
    .chk{color:var(--green);font-weight:900;font-size:18px}
    
    .section-head{text-align:center;margin:60px 0 24px}
    .section-head h2{font-size:38px;letter-spacing:-.04em;margin:0 0 10px}
    .section-head p{color:var(--muted);max-width:640px;margin:0 auto;font-size:15px;line-height:1.6}
    
    .alacarte-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px;margin-top:34px}
    .card{background:rgba(18,20,25,.9);border:1px solid var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s,border-color .2s;box-shadow:0 15px 35px rgba(0,0,0,.3)}
    .card:hover{transform:translateY(-4px);border-color:rgba(240,184,0,.4);box-shadow:0 20px 45px rgba(240,184,0,.12)}
    .sku-cat{color:var(--blue);font:800 10px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
    .card h3{font-size:24px;margin:12px 0 8px;letter-spacing:-.02em}
    .sku-price{font-size:34px;font-weight:900;color:var(--green);margin:10px 0 4px}
    .sku-old{font-size:13px;color:var(--muted);margin-bottom:18px;font-style:italic}
    .card p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 28px}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/"><span class="mark">WY</span><span><b>WEYLANDAI</b><small>SUBCONP OPERATING SUITE</small></span></a>
