<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <title>Venture Deck | WeylandAI SubConP Operating Suite</title>
  <style>
    :root{--bg:#090a0d;--panel:#121419;--line:#2c3139;--text:#edf0f1;--muted:#9299a3;--gold:#f0b800;--green:#61dfa0;--blue:#66d4ff}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Avenir Next","Helvetica Neue",sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 10%,rgba(240,184,0,.12),transparent 30rem),linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:auto,30px 30px,30px 30px}
    .shell{position:relative;max-width:1400px;margin:auto;padding:20px clamp(16px,3vw,40px) 50px}
    header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none}
    .mark{width:42px;height:42px;display:grid;place-items:center;background:var(--gold);color:var(--bg);font-weight:900}
    .brand b{display:block;letter-spacing:.16em}
    .brand small{display:block;color:var(--muted);font:700 9px/1.5 ui-monospace,monospace;letter-spacing:.11em}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav a,.button{border:1px solid var(--line);border-radius:99px;padding:9px 14px;color:var(--text);text-decoration:none;background:transparent;font:750 10px/1 ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:all .2s}
    .nav a:hover,.button:hover{border-color:var(--gold);color:var(--gold)}
    .button.primary{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:900}
    
    .titlebar{display:flex;justify-content:space-between;align-items:end;gap:25px;margin:30px 0 25px}
    .eyebrow{color:var(--gold);font:800 11px/1 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}
    .titlebar h1{font-size:clamp(34px,4.5vw,56px);letter-spacing:-.05em;line-height:1.02;margin:10px 0}
    .pill{border:1px solid rgba(240,184,0,.4);color:var(--gold);border-radius:99px;padding:10px 15px;font:800 10px/1 ui-monospace,monospace;letter-spacing:.1em;background:rgba(240,184,0,.1)}
    
    .deck-frame{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);height:750px;width:100%;margin-bottom:30px;position:relative}
    iframe{width:100%;height:100%;border:0}
    
    .telemetry-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:35px}
    .stat-card{background:rgba(18,20,25,.9);border:1px solid var(--line);border-radius:14px;padding:20px}
    .stat-card span{color:var(--muted);font:700 10px/1 ui-monospace,monospace;letter-spacing:.1em;display:block}
    .stat-card strong{font-size:30px;font-weight:900;color:var(--text);margin-top:8px;display:block}
    
    @media(max-width:900px){.telemetry-bar{grid-template-columns:repeat(2,1fr)}.titlebar{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/"><span class="mark">VD</span><span><b>VENTURE DECK</b><small>INSTITUTIONAL DATA ROOM</small></span></a>
      <nav class="nav">{{NAV}}) +
